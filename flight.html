<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航班动态 | 老牧师航空</title>
    <script src="assets/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="text-textDark">
    <div id="siteHeader"></div>
    <main class="pt-24 pb-16 container mx-auto px-4">
        <h2 class="text-[26px] font-bold text-primary mb-8">航班动态</h2>
        <div class="bg-white p-6 rounded-global shadow-lg">
            <label class="block mb-2">输入航班号</label>
            <input id="searchFlightNo" type="text" class="w-full border px-4 py-3 rounded-global mb-4" placeholder="例如：LMS001">
            <button onclick="queryFlightStatus()" class="btn-hover w-full bg-gold text-primary font-bold py-3 rounded-global">查询航班状态</button>
            <div id="statusResult" class="mt-6"></div>
        </div>
    </main>
    <div id="siteFooter"></div>
    <script src="assets/data.js"></script>
    <script src="assets/common.js"></script>
    <script>
        function flightStatus(f){
            const now=Date.now();
            const {depMs,arrMs}=parseFlightTime(f.date,f.time);
            if(now<depMs-2*3600000)return {t:'计划正常',cls:'text-success'};
            if(now<depMs)return {t:'正在值机',cls:'text-gold'};
            if(now<arrMs)return {t:'飞行中',cls:'text-primary'};
            return {t:'已到达',cls:'text-gray-500'};
        }
        function queryFlightStatus(){
            let no=document.getElementById("searchFlightNo").value.trim().toUpperCase();
            let f=findFlight(no);
            let r=document.getElementById("statusResult");
            if(!f){r.innerHTML='<p class="text-danger">未查询到此航班，请输入 LMS001 起的三位航班号（如 LMS055）。</p>';return;}
            const st=flightStatus(f);
            const {depMs,arrMs}=parseFlightTime(f.date,f.time);
            const fmt=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0')+" "+String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');};
            r.innerHTML='<div class="p-4 border rounded-global shadow-sm">'+
                '<p>航班号：<span class="font-bold">'+f.no+'</span></p>'+
                '<p>航线：'+f.start+' → '+f.end+'</p>'+
                '<p>计划起飞：'+f.date+' '+f.time+'</p>'+
                '<p>预计到达：'+fmt(arrMs)+'</p>'+
                '<p class="'+st.cls+' font-bold mt-2">当前状态：'+st.t+'</p>'+
                '<p class="text-textGray text-sm mt-1">数据更新于 '+fmt(Date.now())+'</p>'+
                '</div>';
        }
        document.getElementById("searchFlightNo").addEventListener("keydown",e=>{if(e.key==="Enter")queryFlightStatus();});
    </script>
</body>
</html>
