<!DOCTYPE html>

<head>

</head>
<body class="text-textDark" style="background:linear-gradient(180deg,rgba(242,244,242,0.92) 0%,rgba(242,244,242,0.78) 35%,rgba(216,223,230,0.55) 65%,rgba(216,223,230,0.72) 100%),url('assets/hero_bg.png?v=20260919t') center/cover fixed no-repeat;">
    <div id="siteHeader"></div>
    <main class="pt-24 pb-12">
        <!-- Hero：Apple 式大标题 + 留白 -->
        <section class="text-center" style="padding:80px 20px 70px">
            <p class="text-textDark/60 font-medium mb-4 tracking-wide anim-down" style="font-size:15px;letter-spacing:0.22em">LAOMUSI AIRLINES</p>
            <h1 class="font-bold text-textDark hero-slide" style="font-size:clamp(48px,7vw,88px);letter-spacing:-0.03em;line-height:1.03">
                Hello, Welcome to Laomusi Airlines.
            </h1>
            <p class="mt-5 text-textDark/70 anim-up d2" style="font-size:clamp(18px,1.5vw,22px)">虔诚 · 严谨 · 安心，像牧师般守护每一段飞行</p>
            <div class="mt-8 flex flex-wrap justify-center gap-4 anim-up d3">

        <!-- 大卡片 1：机票预订 -->

            <div class="bg-card card-gold rounded-big shadow-xl text-center" style="padding:70px 20px 40px;min-height:560px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                    <h2 class="font-bold text-textDark" style="font-size:clamp(36px,4.5vw,56px);letter-spacing:-0.02em">机票预订</h2>
                    <p class="mt-3 text-textDark/70" style="font-size:19px">从这里开始旅程。全球航线，一次锁定。</p>
                    <div class="mt-5 flex flex-wrap justify-center gap-4">
                        <a href="booking.html" class="font-semibold anim-link" style="color:#4a5a6e;font-size:17px">查询 <i class="fa fa-angle-right ml-1"></i></a>
                        <a href="member.html" class="font-semibold anim-link" style="color:#4a5a6e;font-size:17px">会员专享 <i class="fa fa-angle-right ml-1"></i></a>
                    </div>
                </div>
                <div class="mt-8 flex justify-center">
                    <i class="fa fa-plane text-gold anim-float" style="font-size:120px;transform:rotate(-15deg);opacity:0.85"></i>
                </div>
            </div>
        </section>

        <!-- 大卡片 2：空铁联运 -->
        <section class="px-3 md:px-5 mb-3 md:mb-4 reveal">
            <div class="bg-card card-gold rounded-big shadow-xl text-center" style="padding:70px 20px 40px;min-height:560px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                    <h2 class="font-bold text-textDark" style="font-size:clamp(36px,4.5vw,56px);letter-spacing:-0.02em">空铁联运</h2>
                    <p class="mt-3 text-textDark/70" style="font-size:19px">飞机 + 高铁，一票直达目的地。</p>
                    <div class="mt-5 flex flex-wrap justify-center gap-4">
                        <a href="booking.html?mode=railair" class="font-semibold anim-link" style="color:#4a5a6e;font-size:17px">预订 <i class="fa fa-angle-right ml-1"></i></a>
                    </div>
                </div>
                <div class="mt-8 flex justify-center items-end">
                    <img src="assets/railair_icon.png?v=20260919t" alt="空铁联运" class="anim-float" style="height:110px;width:auto;border-radius:24px;box-shadow:0 10px 30px rgba(74,90,110,0.18);background:#fff;padding:14px 18px">
                </div>
            </div>
        </section>

        <!-- 双列小卡片：Apple 式 grid -->
        <section class="px-3 md:px-5 grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 mb-3 md:mb-4">
            <div class="reveal bg-card card-gold rounded-big shadow-xl text-center" style="padding:50px 20px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                    <h3 class="font-bold text-textDark" style="font-size:clamp(28px,3vw,40px)">在线值机</h3>
                    <p class="mt-2 text-textDark/70" style="font-size:17px">选好座位，轻装出行。</p>
                    <div class="mt-4">
                        <a href="checkin.html" class="font-semibold anim-link" style="color:#4a5a6e;font-size:16px">立即值机 <i class="fa fa-angle-right ml-1"></i></a>
                    </div>
                </div>
                <div class="mt-6 flex justify-center">
                    <i class="fa fa-qrcode text-gold anim-float" style="font-size:72px;opacity:0.85"></i>
                </div>
            </div>
            <div class="reveal bg-card card-gold rounded-big shadow-xl text-center" style="padding:50px 20px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                    <h3 class="font-bold text-textDark" style="font-size:clamp(28px,3vw,40px)">航班动态</h3>
                    <p class="mt-2 text-textDark/70" style="font-size:17px">实时掌握每一次起落。</p>
                    <div class="mt-4">
                        <a href="flight.html" class="font-semibold anim-link" style="color:#4a5a6e;font-size:16px">查询 <i class="fa fa-angle-right ml-1"></i></a>
                    </div>
                </div>
                <div class="mt-6 flex justify-center">
                    <i class="fa fa-clock-o text-gold anim-float" style="font-size:72px;opacity:0.85;animation-delay:.2s"></i>
                </div>
            </div>
            <div class="reveal bg-card card-gold rounded-big shadow-xl text-center" style="padding:50px 20px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                    <h3 class="font-bold text-textDark" style="font-size:clamp(28px,3vw,40px)">会员中心</h3>
                    <p class="mt-2 text-textDark/70" style="font-size:17px">常旅客礼遇，从这里开始。</p>
                    <div class="mt-4">
                        <a href="member.html" class="font-semibold anim-link" style="color:#4a5a6e;font-size:16px">了解会员 <i class="fa fa-angle-right ml-1"></i></a>
                    </div>
                </div>
                <div class="mt-6 flex justify-center">
                    <i class="fa fa-diamond text-gold anim-float" style="font-size:72px;opacity:0.85;animation-delay:.4s"></i>

            </div>
            <div class="reveal bg-card card-gold rounded-big shadow-xl text-center" style="padding:50px 20px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                    <h3 class="font-bold text-textDark" style="font-size:clamp(28px,3vw,40px)">购物车</h3>
                    <p class="mt-2 text-textDark/70" style="font-size:17px">确认行程，安心支付。</p>
                    <div class="mt-4">
                        <a href="cart.html" class="font-semibold anim-link" style="color:#4a5a6e;font-size:16px">查看购物袋 <i class="fa fa-angle-right ml-1"></i></a>
                    </div>
                </div>
                <div class="mt-6 flex justify-center">
                    <i class="fa fa-shopping-bag text-gold anim-float" style="font-size:72px;opacity:0.85;animation-delay:.6s"></i>
                </div>
            </div>
        </section>

        <!-- 热门航线：Apple 式窄卡片 -->
        <section class="px-3 md:px-5 reveal">
            <div class="bg-card card-gold rounded-big shadow-xl" style="padding:50px 30px">
                <h3 class="font-bold text-textDark text-center" style="font-size:clamp(24px,2.5vw,32px)">热门航线</h3>
                <p class="text-center text-textDark/60 mt-2 mb-8">精选全球热门目的地</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <button type="button" class="w-full text-left p-5 rounded-big bounce-hover cursor-pointer border border-white/40" style="background:rgba(255,255,255,0.4);color:#1d1d1f" onclick="quickSearch('北京','广州')">
                        <p class="font-semibold text-lg">北京 → 广州</p>
                        <p class="text-sm text-textGray mt-1">约 3 小时 · 每日多班</p>
                    </button>
                    <button type="button" class="w-full text-left p-5 rounded-big bounce-hover cursor-pointer border border-white/40" style="background:rgba(255,255,255,0.4);color:#1d1d1f" onclick="quickSearch('上海','纽约')">
                        <p class="font-semibold text-lg">上海 → 纽约</p>
                        <p class="text-sm text-textGray mt-1">约 14 小时 · 直飞</p>
                    </button>
                    <button type="button" class="w-full text-left p-5 rounded-big bounce-hover cursor-pointer border border-white/40" style="background:rgba(255,255,255,0.4);color:#1d1d1f" onclick="quickSearch('北京','迪拜')">
                        <p class="font-semibold text-lg">北京 → 迪拜</p>
                        <p class="text-sm text-textGray mt-1">约 9 小时 · 直飞</p>
                    </button>
                    <button type="button" class="w-full text-left p-5 rounded-big bounce-hover cursor-pointer border border-white/40" style="background:rgba(255,255,255,0.4);color:#1d1d1f" onclick="quickSearch('上海','悉尼')">
                        <p class="font-semibold text-lg">上海 → 悉尼</p>
                        <p class="text-sm text-textGray mt-1">约 10 小时 · 直飞</p>
                    </button>
                    <button type="button" class="w-full text-left p-5 rounded-big bounce-hover cursor-pointer border border-white/40" style="background:rgba(255,255,255,0.4);color:#1d1d1f" onclick="quickSearch('北京','新加坡')">
                        <p class="font-semibold text-lg">北京 → 新加坡</p>
                        <p class="text-sm text-textGray mt-1">约 6 小时 · 直飞</p>
                    </button>
                    <button type="button" class="w-full text-left p-5 rounded-big bounce-hover cursor-pointer border border-white/40" style="background:rgba(255,255,255,0.4);color:#1d1d1f" onclick="quickSearch('上海','伦敦')">
                        <p class="font-semibold text-lg">上海 → 伦敦</p>
                        <p class="text-sm text-textGray mt-1">约 12 小时 · 直飞</p>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <div id="siteFooter"></div>
    <script src="assets/data.js?v=20260919t"></script>
    <script src="assets/common.js?v=20260919t"></script>
    <script>
        function quickSearch(start,end){location.href=`booking.html?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;}
        // 滚动浮现动效：每次进入视口都重新播放
        const io=new IntersectionObserver(entries=>{
            entries.forEach(e=>{
                if(e.isIntersecting){
                    e.target.classList.add('visible');
                }else{
                    e.target.classList.remove('visible');
                }
            });
        },{threshold:0.15,rootMargin:'0px 0px -60px 0px'});
        document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    </script>
</body>
</html>
