<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老牧师航空 - 首页</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="assets/tailwind-config.js?v=20260827b"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=20260827b">
</head>
<body class="text-textDark">
    <div id="siteHeader"></div>
    <main class="pt-24 pb-16 container mx-auto px-4">
        <div class="bg-primary rounded-global p-10 text-white text-center my-6">
            <h1 class="text-[32px] font-bold mb-4">欢迎来到老牧师航空</h1>
            <p class="mb-6">虔诚 · 严谨 · 安心，守护您每一段航程</p>
            <a href="booking.html" class="btn-hover inline-block bg-gold text-primary font-bold py-3 px-8 rounded-global">查询航班</a>
            <a href="booking.html?mode=railair" class="btn-hover inline-block border border-gold text-gold font-bold py-3 px-8 rounded-global ml-3">空铁联运</a>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-6 gap-6 my-10">
            <a href="booking.html" class="bg-card card-gold p-6 rounded-global shadow-lg card-hover text-center">
                <i class="fa fa-plane text-gold text-4xl mb-3"></i>
                <h3 class="font-bold text-lg">机票预订</h3>
            </a>
            <a href="booking.html?mode=railair" class="bg-card card-gold p-6 rounded-global shadow-lg card-hover text-center">
                <i class="fa fa-train text-gold text-4xl mb-3"></i>
                <h3 class="font-bold text-lg">空铁联运</h3>
            </a>
            <a href="checkin.html" class="bg-card card-gold p-6 rounded-global shadow-lg card-hover text-center">
                <i class="fa fa-qrcode text-gold text-4xl mb-3"></i>
                <h3 class="font-bold text-lg">在线值机</h3>
            </a>
            <a href="flight.html" class="bg-card card-gold p-6 rounded-global shadow-lg card-hover text-center">
                <i class="fa fa-clock-o text-gold text-4xl mb-3"></i>
                <h3 class="font-bold text-lg">航班动态</h3>
            </a>
            <a href="cart.html" class="bg-card card-gold p-6 rounded-global shadow-lg card-hover text-center">
                <i class="fa fa-shopping-cart text-gold text-4xl mb-3"></i>
                <h3 class="font-bold text-lg">购物车</h3>
            </a>
            <a href="order.html" class="bg-card card-gold p-6 rounded-global shadow-lg card-hover text-center">
                <i class="fa fa-ticket text-gold text-4xl mb-3"></i>
                <h3 class="font-bold text-lg">我的订单</h3>
            </a>
        </div>
        <div class="bg-card card-gold p-6 rounded-global shadow-lg mt-10">
            <h3 class="text-xl font-bold text-gold mb-4">热门航线快速查询</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <button type="button" class="w-full text-center p-4 border rounded-global card-hover cursor-pointer" onclick="quickSearch('北京','广州')">北京 → 广州</button>
                <button type="button" class="w-full text-center p-4 border rounded-global card-hover cursor-pointer" onclick="quickSearch('上海','纽约')">上海 → 纽约</button>
                <button type="button" class="w-full text-center p-4 border rounded-global card-hover cursor-pointer" onclick="quickSearch('北京','迪拜')">北京 → 迪拜</button>
                <button type="button" class="w-full text-center p-4 border rounded-global card-hover cursor-pointer" onclick="quickSearch('上海','悉尼')">上海 → 悉尼</button>
                <button type="button" class="w-full text-center p-4 border rounded-global card-hover cursor-pointer" onclick="quickSearch('北京','新加坡')">北京 → 新加坡</button>
                <button type="button" class="w-full text-center p-4 border rounded-global card-hover cursor-pointer" onclick="quickSearch('上海','伦敦')">上海 → 伦敦</button>
            </div>
        </div>
    </main>
    <div id="siteFooter"></div>
    <script src="assets/data.js?v=20260827b"></script>
    <script src="assets/common.js?v=20260827b"></script>
    <script>
        function quickSearch(start,end){location.href=`booking.html?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;}
    </script>
</body>
</html>
