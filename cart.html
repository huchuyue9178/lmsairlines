<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 | 老牧师航空</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="assets/tailwind-config.js?v=20261006perf"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=20261107r5">
    <link rel="stylesheet" href="assets/refresh.css?v=20261107r5">
    <link rel="stylesheet" href="assets/liquid.css?v=20261108r1">
    <script src="assets/theme.js?v=20261107r5"></script>
</head>
<body class="text-textDark">
    <div id="siteHeader"></div>
    <main class="pt-24 pb-16 container mx-auto px-4">
        <h2 class="text-[26px] font-bold text-gold mb-8">购物车</h2>
        <div id="cartList"></div>
    </main>
    <div id="paymentModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-card card-gold w-full max-w-lg p-6 rounded-global">
            <h3 class="text-xl font-bold text-gold mb-4">在线支付</h3>
            <div id="paymentInfo" class="mb-4 text-sm"></div>
            <div id="couponRow" class="hidden mb-4">
                <label class="block mb-1">优惠券（会员里程兑换）</label>
                <select id="couponSelect" class="w-full border px-4 py-3 rounded-global" onchange="updatePayInfo()"></select>
            </div>
            <div id="railSeatRow" class="hidden mb-4">
                <label class="block mb-1">铁路坐席（空铁联运）</label>
                <div id="railSeatList" class="space-y-2"></div>
            </div>
            <div class="space-y-3">
                <div><label class="block mb-1">支付方式</label>
                    <div class="w-full border px-4 py-3 rounded-global flex items-center justify-between gap-3">
                        <span class="font-semibold"><i class="fa fa-wallet mr-2 text-gold"></i>会员账户余额（模拟支付）</span>
                        <span id="payBalance" class="text-sm text-textGray flex-none">余额 ¥0</span>
                    </div>
                </div>
                <div id="payWarn" class="hidden text-sm text-danger leading-relaxed"></div>
                <p id="payHint" class="text-xs text-textGray">余额不足时无法支付，可先到会员中心充值（模拟充值，即时到账）。</p>
            </div>
            <div class="flex gap-4 mt-6"><button onclick="closePaymentModal()" class="flex-1 border py-3 rounded-global">返回</button><button id="paySubmitBtn" onclick="confirmPayment()" class="flex-1 bg-gold text-primary font-bold py-3 rounded-global btn-hover">确认支付</button></div>
        </div>
    </div>
    <div id="siteFooter"></div>
    <script src="assets/data.js?v=20261006perf"></script>
    <script src="assets/common.js?v=20261107r5"></script>
    <script src="assets/owner.js?v=20261107owner"></script>
    <script src="assets/dev.js?v=20261107r5"></script>
    <script>
        const TRAIN_SEAT_KEYS=['second','first','business'];
        const TRAIN_SEAT_NAME={second:'二等座',first:'一等座',business:'商务座'};
        function renderCartList(){
            let c=getCart(),d=document.getElementById("cartList");
            if(c.length===0){d.innerHTML='<div class="bg-card card-gold p-6 rounded-global shadow-lg">购物车为空，请先去预订航班。</div>';return;}
            let total=c.reduce((s,i)=>s+i.price,0),h="";
            c.forEach((item,index)=>{
                const isRA=item.type==="railair";
                let body=isRA
                    ?'<p class="font-bold text-gold"><i class="fa fa-train"></i> 空铁联运｜'+esc(item.start)+'→'+esc(item.end)+'</p>'+
                    '<p class="text-sm mt-1"><i class="fa fa-plane text-gold"></i> '+esc(item.flightNo)+'　'+esc(item.flightStart)+'→'+esc(item.flightEnd)+'</p>'+
                    '<p class="text-sm text-textGray ml-4">'+esc(item.flightDate)+' '+esc(item.flightTime)+'</p>'+
                    '<p class="text-sm"><i class="fa fa-train text-gold"></i> '+esc(item.trainNo)+'　'+esc(item.trainFrom)+'→'+esc(item.trainTo)+'　'+esc(item.trainTime)+'（'+esc(item.trainDur)+'）　'+esc(item.trainSeat||'二等座')+'</p>'
                    :'<p class="font-bold">'+esc(item.flightNo)+'｜'+esc(item.start)+'→'+esc(item.end)+'</p>'+
                    '<p class="text-sm text-textGray">'+esc(item.date)+' '+esc(item.time)+'</p>';
                h+='<div class="bg-card card-gold p-6 rounded-global shadow-lg mb-4"><div class="flex justify-between flex-wrap gap-3">'+
                    '<div>'+body+
                    '<p class="text-sm">舱位：'+esc(item.cabin)+'</p>'+
                    '<p class="text-sm">乘客：'+esc(item.username)+'</p>'+
                    '<p class="text-danger font-bold mt-2">¥'+item.price+(isRA?'（含高铁'+esc(item.trainSeat||'二等座')+'）':'')+'</p></div>'+
                    '<button onclick="removeFromCart('+index+')" class="text-danger border border-danger px-3 py-1 rounded-global text-sm btn-hover">删除</button>'+
                    '</div></div>';
            });
            h+='<div class="bg-card card-gold p-6 rounded-global shadow-lg mt-6"><div class="flex justify-between items-center mb-4"><span class="text-lg font-bold">购物车总计</span><span class="text-danger text-2xl font-bold">¥'+total+'</span></div><button onclick="openPaymentModal()" class="btn-hover w-full bg-gold text-primary font-bold py-3 rounded-global">立即支付</button></div>';
            d.innerHTML=h;
        }
        function removeFromCart(i){let c=getCart();c.splice(i,1);saveCart(c);renderCartList();}
        function openPaymentModal(){
            let c=getCart();if(c.length===0){showToast("购物车为空，无法支付");return;}
            let total=c.reduce((s,i)=>s+i.price,0);
            const coupons=availableCoupons(),cr=document.getElementById("couponRow"),sel=document.getElementById("couponSelect");
            if(coupons.length===0){cr.classList.add("hidden");sel.innerHTML="";}
            else{
                cr.classList.remove("hidden");
                sel.innerHTML='<option value="0">不使用优惠券</option>'+coupons.map(x=>'<option value="'+esc(x.code)+'">¥'+Number(x.value||0).toLocaleString()+' '+(x.owner?'站长专属礼券':'代金券')+'（'+esc(x.code)+'）</option>').join('');
            }
            document.getElementById("paymentModal").classList.remove("hidden");
            renderPayRailSeats();
            updatePayInfo();
        }
        // 付款时选择铁路坐席（空铁联运）
        function renderPayRailSeats(){
            const c=getCart(),row=document.getElementById("railSeatRow"),list=document.getElementById("railSeatList");
            const rails=c.map((it,i)=>({it,i})).filter(x=>x.it.type==="railair");
            if(rails.length===0){row.classList.add("hidden");list.innerHTML="";return;}
            row.classList.remove("hidden");
            list.innerHTML=rails.map(({it,i})=>{
                const tp=it.trainPrice||{second:60,first:100,business:180};
                const cur=it.trainSeatPrice||tp.second;
                const curKey=cur===tp.first?'first':(cur===tp.business?'business':'second');
                const curName=it.trainSeat||TRAIN_SEAT_NAME[curKey];
                return '<div class="bg-black/20 border border-gold/20 rounded-global p-3">'+
                    '<p class="text-xs text-textGray mb-2"><i class="fa fa-train text-gold"></i> 高铁 '+esc(it.trainNo)+' '+esc(it.trainFrom)+'→'+esc(it.trainTo)+'　当前：<span class="text-gold">'+esc(curName)+'</span></p>'+
                    '<div class="flex flex-wrap gap-2">'+
                    TRAIN_SEAT_KEYS.map(k=>
                        '<button type="button" onclick="pickPaySeat('+i+',\''+k+'\')" class="px-3 py-1 rounded text-xs '+(k===curKey?'bg-gold text-primary font-bold':'border border-gold/50 text-textGray btn-hover')+'">'+TRAIN_SEAT_NAME[k]+' ¥'+tp[k]+'</button>').join(' ')+
                    '</div></div>';
            }).join('');
        }
        function pickPaySeat(idx,key){
            const c=getCart(),it=c[idx];
            if(!it||it.type!=="railair")return;
            const tp=it.trainPrice||{second:60,first:100,business:180};
            const oldP=it.trainSeatPrice||tp.second;
            const newP=tp[key];
            const diff=newP-oldP;
            it.price=Math.max(0,Math.round((it.price||0)+diff));
            it.trainSeat=TRAIN_SEAT_NAME[key];
            it.trainSeatPrice=newP;
            saveCart(c);
            renderPayRailSeats();
            updatePayInfo();
        }
        function payContext(){
            const c=getCart();
            const total=c.reduce((s,i)=>s+i.price,0);
            const sel=document.getElementById("couponSelect");
            const code=sel&&sel.value?sel.value:"0";
            const coupon=code==="0"?null:getCoupons().find(x=>x.code===code);
            const couponValue=coupon?coupon.value:0;
            return {cart:c,total:total,coupon:coupon,couponValue:couponValue,payTotal:Math.max(0,total-couponValue)};
        }
        function updatePayInfo(){
            const ctx=payContext();
            const m=getMember(),bal=getBalance();
            const after=Math.max(0,bal-ctx.payTotal);
            document.getElementById("paymentInfo").innerHTML='<p>待支付机票：'+ctx.cart.length+' 张</p>'
                +(ctx.coupon?'<p class="text-success">优惠券抵扣：-¥'+ctx.couponValue+'</p>':'')
                +'<p class="text-danger font-bold text-lg mt-2">实付金额：¥'+ctx.payTotal+'</p>'
                +'<p class="mt-1 text-sm '+((!m||ctx.payTotal>bal)?'text-danger':'text-textGray')+'">账户余额：¥'+bal
                +(m?'（支付后 ¥'+after+'）':'· 未登录会员')+'</p>';
            const pb=document.getElementById("payBalance");
            if(pb)pb.textContent='余额 ¥'+bal;
            const warn=document.getElementById("payWarn");
            const btn=document.getElementById("paySubmitBtn");
            let msg='';
            if(!m)msg='未检测到登录会员，余额支付需要先登录会员账户。';
            else if(ctx.payTotal>bal)msg='余额不足，还需充值 ¥'+(ctx.payTotal-bal)+'（当前余额 ¥'+bal+'）。';
            const hint=document.getElementById("payHint");
            if(msg){
                if(warn){warn.textContent=msg;warn.classList.remove("hidden");}
                if(btn)btn.textContent='余额不足 · 去充值';
                if(hint)hint.textContent='余额不足时无法支付，可先到会员中心充值（模拟充值，即时到账）。';
            }else{
                if(warn)warn.classList.add("hidden");
                if(btn)btn.textContent='确认支付';
                if(hint)hint.textContent='本次支付将从账户余额扣款 ¥'+ctx.payTotal+'，支付后余额 ¥'+(bal-ctx.payTotal)+'。';
            }
        }
        function goRecharge(){
            const need=Math.max(0,payContext().payTotal-getBalance());
            location.href="member.html?recharge=1&amount="+(need>0?need:500);
        }
        function closePaymentModal(){document.getElementById("paymentModal").classList.add("hidden");}
        async function confirmPayment(){
            let c=getCart(),btn=document.getElementById("paySubmitBtn");
            let total=c.reduce((s,i)=>s+i.price,0);
            const sel=document.getElementById("couponSelect");
            const code=sel&&sel.value?sel.value:"0";
            const coupon=code==="0"?null:getCoupons().find(x=>x.code===code);
            const couponValue=coupon?coupon.value:0;
            const payTotal=Math.max(0,total-couponValue);
            const m0=getMember(),bal0=getBalance();
            if(!m0){
                showToast("请先登录会员账户后再支付","warn");
                return;
            }
            if(payTotal>bal0){
                showToast("余额不足，还需充值 ¥"+(payTotal-bal0)+"，正在前往充值…","warn");
                setTimeout(function(){goRecharge();},900);
                return;
            }
            const doPay=async function(){
                btn.disabled=true;btn.innerText="支付加载中，请稍候...";
                await new Promise(r=>setTimeout(r,3000));
                const payRes=payWithBalance(payTotal,"机票支付 · "+c.length+" 张");
                if(!payRes.ok){
                    btn.disabled=false;btn.innerText="确认支付";
                updatePayInfo();
                    showToast(payRes.reason==='insufficient'?("余额不足，还需充值 ¥"+(payRes.need||0)):"支付失败，请重新登录后再试","warn");
                    updatePayInfo();
                    return;
                }
                let orders=loadOrders();const ts=Date.now();
                const m=getMember();
                c.forEach(item=>{
                    const payPrice=coupon?Math.max(0,Math.round(item.price-item.price*couponValue/total)):item.price;
                    const {cartId,...rest}=item;
                    orders.push(Object.assign({},rest,{orderId:"ORD"+ts+Math.floor(Math.random()*1000),status:"支付处理中",createTime:ts,memberCardNo:m?m.cardNo:null,milesEarned:m?Math.round(payPrice):0,payPrice:payPrice,payMethod:"余额支付",couponCode:coupon?coupon.code:null,couponValue:coupon?couponValue:0,
                        weatherRisk:item.weatherRisk?true:false,
                        weatherReason:item.weatherReason||'',
                        riskEvalAt:item.weatherRisk?ts+30000:null}));
                });
                if(m){earnMiles(payTotal);}
                if(coupon){coupon.status="已使用";coupon.usedAt=Date.now();saveCoupons(getCoupons().map(x=>x.code===coupon.code?coupon:x));}
                saveOrders(orders);
                localStorage.removeItem("airCart");
                updateCartBadge();
                showToast("支付成功！已从账户余额扣款 ¥"+payTotal+"，剩余余额 ¥"+getBalance()+"。"+(m?"已累积 "+Math.round(payTotal)+" 里程。":"")+"订单已生成，稍后可在【我的订单】查看。","success");
                btn.disabled=false;btn.innerText="确认支付";
                setTimeout(function(){location.href="order.html";},1600);
            };
            if(payTotal>1000){showConfirm("您即将支付 ¥"+payTotal+"，金额大于 1000 元，请再次确认是否付款？",doPay);}
            else{doPay();}
        }
        renderCartList();
    </script>
<script src="assets/i18n.js?v=20261107r5"></script>
</body>
</html>
