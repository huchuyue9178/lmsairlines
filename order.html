<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 | 老牧师航空</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="assets/tailwind-config.js?v=20260828b"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=20260828b">
</head>
<body class="text-textDark">
    <div id="siteHeader"></div>
    <main class="pt-24 pb-16 container mx-auto px-4">
        <h2 class="text-[26px] font-bold text-gold mb-8">我的订单</h2>
        <div id="orderList"></div>
    </main>
    <div id="changeModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-card card-gold w-full max-w-lg p-6 rounded-global">
            <h3 class="text-xl font-bold text-gold mb-4">免费改签</h3>
            <div id="changeInfo" class="mb-4 text-sm"></div>
            <div><label class="block mb-1">选择新出发日期</label><select id="changeDate" class="w-full border px-4 py-3 rounded-global"></select></div>
            <div class="flex gap-4 mt-6">
                <button onclick="closeChange()" class="flex-1 border py-3 rounded-global">取消</button>
                <button onclick="confirmChange()" class="flex-1 bg-gold text-primary font-bold py-3 rounded-global btn-hover">确认改签</button>
            </div>
        </div>
    </div>
    <div id="cabinModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-card card-gold w-full max-w-lg p-6 rounded-global">
            <h3 class="text-xl font-bold text-gold mb-4"><i class="fa fa-exchange mr-2"></i>升舱 / 降舱</h3>
            <div id="cabinInfo" class="mb-4 text-sm"></div>
            <div id="cabinOptions" class="space-y-2 mb-4"></div>
            <div id="cabinSummary" class="mb-4 text-sm"></div>
            <div class="flex gap-4">
                <button onclick="closeCabinChange()" class="flex-1 border py-3 rounded-global">取消</button>
                <button onclick="confirmCabinChange()" id="cabinConfirmBtn" disabled class="flex-1 bg-gold text-primary font-bold py-3 rounded-global btn-hover opacity-50 cursor-not-allowed">请选择舱位</button>
            </div>
        </div>
    </div>
    <div id="compModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-card card-gold w-full max-w-lg p-6 rounded-global">
            <h3 class="text-xl font-bold text-gold mb-4"><i class="fa fa-gift mr-2"></i>选择补偿方案</h3>
            <div id="compInfo" class="mb-4 text-sm"></div>
            <div class="space-y-2 mb-4">
                <button onclick="chooseCompensation('refund')" class="w-full border border-gold/30 rounded-global px-4 py-3 text-left btn-hover"><span class="font-bold">全额退款</span><span class="text-textGray text-sm ml-2">按实付金额原路退回</span></button>
                <button onclick="chooseCompensation('coupon')" class="w-full border border-gold/30 rounded-global px-4 py-3 text-left btn-hover"><span class="font-bold">¥100 优惠券</span><span class="text-textGray text-sm ml-2">下次购票可抵扣</span></button>
                <button onclick="chooseCompensation('miles')" class="w-full border border-gold/30 rounded-global px-4 py-3 text-left btn-hover"><span class="font-bold">2000 里程</span><span class="text-textGray text-sm ml-2">累积至会员账户</span></button>
            </div>
            <div class="flex gap-4">
                <button onclick="closeCompensation()" class="flex-1 border py-3 rounded-global">取消</button>
            </div>
        </div>
    </div>
    <div id="siteFooter"></div>
    <script src="assets/data.js?v=20260828b"></script>
    <script src="assets/common.js?v=20260828b"></script>
    <script>
        let changeIdx=null,changeFree=false;
        let cabinIdx=null,cabinTargetKey=null;
        // 舱位顺序与映射（用于升/降舱价格多退少补）
        const CABIN_ORDER=['eco','superEco','business','first'];
        const CABIN_KEY={经济舱:'eco',超级经济舱:'superEco',商务舱:'business',头等舱:'first'};
        const CABIN_NAME={eco:'经济舱',superEco:'超级经济舱',business:'商务舱',first:'头等舱'};
        // 按起飞时间窗口计算手续费比例（与政策页一致）
        function refundRate(item){
            const depMs=parseFlightTime(item.date,item.time).depMs;
            const hoursLeft=(depMs-Date.now())/3600000;
            if(hoursLeft>24)return 0.15;
            if(hoursLeft>4)return 0.30;
            return 0.50;
        }
        function renderOrderList(){
            let orders=loadOrders(),d=document.getElementById("orderList");
            if(orders.length===0){d.innerHTML='<div class="bg-card card-gold p-6 rounded-global shadow-lg">暂无订单，请前往机票预订页面购买航班。</div>';return;}
            let h="";
            orders.forEach((item,index)=>{
                const isRA=item.type==="railair";
                const status=resolveStatus(item);
                const sc=(status==='已退票'||status==='恶劣天气取消')?'text-danger':(status==='已完成')?'text-success':(status==='已补偿')?'text-textGray':'text-orange-500';
                let actions='';
                let riskNote='';
                if(item.weatherRisk&&!item.riskResult&&!item.compensated){
                    const remain=item.riskEvalAt?Math.max(0,Math.ceil((item.riskEvalAt-Date.now())/1000)):0;
                    if(remain>0){
                        riskNote='<div class="mt-3 p-3 bg-black/40 border border-amber-400/50 rounded-global text-sm"><i class="fa fa-exclamation-triangle text-amber-300"></i> 恶劣天气预警：'+esc(item.weatherReason||'')+'，航班可能取消。'+
                            '<span class="text-amber-300 font-bold ml-1" data-risk-remain="'+item.orderId+'">'+remain+'</span> 秒后自动评估航班状态…</div>';
                    }
                }else if(item.weatherRisk&&item.riskResult==='ok'){
                    riskNote='<div class="mt-3 p-3 bg-black/40 border border-success/40 rounded-global text-sm"><i class="fa fa-check-circle text-success"></i> 航班天气评估通过，行程不受影响。</div>';
                }
                if(status==='已退票'){
                    actions='<div class="mt-4 text-textGray">已退票，手续费 ¥'+(item.fee||0)+'，已退还 ¥'+(item.refundAmount||0)+'</div>';
                }else if(status==='支付处理中'){
                    actions='<div class="mt-4 text-textGray text-sm">订单支付处理中，约5秒后自动完成，请稍候刷新查看。</div>';
                }else if(status==='恶劣天气取消'){
                    actions='<div class="mt-4 p-3 bg-black/40 border border-danger/50 rounded-global text-sm">'+
                        '<p class="text-danger font-bold mb-2"><i class="fa fa-cloud-rain"></i> 因恶劣天气，航班已取消。请选择处理方案：</p>'+
                        '<div class="flex flex-wrap gap-3">'+
                        '<button onclick="openChange('+index+',true)" class="px-4 py-2 bg-primary text-white rounded-global btn-hover">免费改签（免差价）</button>'+
                        '<button onclick="openCompensation('+index+')" class="px-4 py-2 bg-gold text-primary font-bold rounded-global btn-hover">选择其他补偿方案</button>'+
                        '</div></div>';
                }else if(status==='已补偿'){
                    const compTxt=item.compensated==='refund'?'已全额退款 ¥'+(item.refundAmount||0)+'（原路退回）':item.compensated==='coupon'?'已发放 ¥100 补偿优惠券':'已补偿 2000 里程至会员账户';
                    actions='<div class="mt-4 text-textGray"><i class="fa fa-check-circle text-success"></i> '+compTxt+'</div>';
                }else{
                    const rate=refundRate(item);
                    const base=(item.payPrice!=null?item.payPrice:item.price);
                    const fee=Math.round(base*rate);
                    const refund=base-fee;
                    const changeBtn=isRA
                        ?'<span class="self-center text-textGray text-sm">空铁联运暂不支持在线改签，如需调整行程请联系客服</span>'
                        :'<button onclick="openChange('+index+')" class="px-4 py-2 bg-primary text-white rounded-global btn-hover"'+(item.changed?' disabled style="opacity:.5;cursor:not-allowed"':'')+'>'+(item.changed?'已改签（免费机会已用）':'免费改签')+'</button>';
                    const cabinBtn=isRA
                        ?''
                        :'<button onclick="openCabinChange('+index+')" class="px-4 py-2 border border-gold text-gold rounded-global btn-hover"><i class="fa fa-exchange"></i> 升舱/降舱</button>';
                    const ckLink='checkin.html?orderId='+encodeURIComponent(item.orderId);
                    const ckBtn=item.checkedIn
                        ?'<button onclick="location.href=\''+ckLink+'\'" class="px-4 py-2 bg-gold text-primary font-bold rounded-global btn-hover">已值机 · '+esc(item.seat)+'（查看登机牌）</button>'
                        :'<button onclick="location.href=\''+ckLink+'\'" class="px-4 py-2 bg-gold text-primary font-bold rounded-global btn-hover"><i class="fa fa-qrcode"></i> 在线值机</button>';
                    actions='<div class="mt-4 flex flex-wrap gap-3">'+
                        changeBtn+
                        cabinBtn+
                        '<button onclick="refundOrder('+index+')" class="px-4 py-2 bg-danger text-white rounded-global btn-hover">申请退票（手续费'+rate*100+'% · 退¥'+refund+'）</button>'+
                        ckBtn+
                        '</div>';
                }
                let routeInfo=isRA
                    ?'<p class="text-gold font-bold"><i class="fa fa-train"></i> 空铁联运：'+esc(item.start)+'→'+esc(item.end)+'</p>'+
                    '<p class="mt-1"><i class="fa fa-plane text-gold"></i> 航班 '+esc(item.flightNo)+'：'+esc(item.flightStart)+'→'+esc(item.flightEnd)+'</p>'+
                    '<p class="text-sm text-textGray ml-5">'+esc(item.flightDate)+' '+esc(item.flightTime)+'</p>'+
                    '<p><i class="fa fa-train text-gold"></i> 高铁 '+esc(item.trainNo)+'：'+esc(item.trainFrom)+'→'+esc(item.trainTo)+'　'+esc(item.trainTime)+'（'+esc(item.trainDur)+'）　<span class="text-gold">'+esc(item.trainSeat||'二等座')+'</span></p>'
                    :'<p>航班：'+esc(item.flightNo)+' &nbsp;&nbsp; '+esc(item.start)+'→'+esc(item.end)+'</p>'+
                    '<p>日期：'+esc(item.date)+' '+esc(item.time)+'</p>';
                h+='<div class="bg-card card-gold p-6 rounded-global shadow-lg mb-4">'+
                    '<div class="flex justify-between"><span>订单号：'+esc(item.orderId)+'</span><span class="'+sc+'">'+status+'</span></div>'+
                    '<hr class="my-3">'+
                    routeInfo+
                    '<p>舱位：'+esc(item.cabin)+'</p>'+
                    '<p>乘客：'+esc(item.username)+'</p>'+
                    '<p>票价：¥'+item.price+(item.payPrice!=null&&item.payPrice!==item.price?'（实付 ¥'+item.payPrice+(item.couponValue?'，券抵扣 ¥'+item.couponValue:'')+'）':'')+(isRA?'（含高铁'+esc(item.trainSeat||'二等座')+'）':'')+'</p>'+
                    (item.cabinChange?'<p class="text-sm '+(item.cabinChange.type==='upgrade'?'text-danger':'text-success')+'"><i class="fa '+(item.cabinChange.type==='upgrade'?'fa-level-up':'fa-level-down')+'"></i> '+esc(item.cabinChange.fromCabin)+' → '+esc(item.cabinChange.toCabin)+'：'+(item.cabinChange.type==='upgrade'?'补差价 ¥'+item.cabinChange.diff:'退回差价 ¥'+item.cabinChange.diff)+'</p>':'')+
                    (item.memberCardNo?'<p class="text-gold">会员 '+esc(item.memberCardNo)+' · 获得里程 +'+(item.milesEarned||0)+'</p>':'')+
                    riskNote+
                    actions+
                    '</div>';
            });
            d.innerHTML=h;
        }
        function refundOrder(idx){
            let orders=loadOrders(),item=orders[idx];
            if(!item)return;
            if(resolveStatus(item)==='已退票'){showToast("该订单已退票，无需重复操作。");return;}
            const base=(item.payPrice!=null?item.payPrice:item.price);
            const rate=refundRate(item),fee=Math.round(base*rate),refund=base-fee;
            showConfirm('确认申请退票？<br>按当前起飞时间窗口，手续费 ¥'+fee+'（票价'+rate*100+'%），实退 ¥'+refund+'。',function(){
                item.status="已退票";item.fee=fee;item.refundAmount=refund;
                item.checkedIn=false;delete item.seat;delete item.gate;delete item.boardTime;
                saveOrders(orders);
                // 回退该订单已累积的会员里程（防"购票刷里程再退票"）
                let milesBack=0;
                const m=getMember();
                if(m&&item.memberCardNo&&item.milesEarned){
                    milesBack=item.milesEarned;
                    m.miles=Math.max(0,(m.miles||0)-milesBack);
                    m.totalMiles=Math.max(0,(m.totalMiles||0)-milesBack);
                    m.level=ffpLevel(m.totalMiles).cur.name;
                    saveMember(m);
                }
                renderOrderList();
                showToast("退票成功"+(milesBack?"，已回退 "+milesBack+" 里程。":"。"));
            });
        }
        function openChange(idx,free){
            let orders=loadOrders(),item=orders[idx];
            if(item.type==="railair"){showToast("空铁联运暂不支持在线改签，如需调整行程请联系客服。");return;}
            if(!free&&item.changed){showToast("该订单已免费改签过一次，机会已用完。");return;}
            changeIdx=idx;changeFree=!!free;
            const dates=[...new Set(searchFlights({start:item.start,end:item.end}).map(f=>f.date))].sort();
            document.getElementById("changeDate").innerHTML=dates.map(d=>'<option value="'+d+'">'+d+'</option>').join('');
            document.getElementById("changeInfo").innerHTML='<p>原航班：'+esc(item.flightNo)+'（'+esc(item.date)+' '+esc(item.time)+'）</p><p>航线：'+esc(item.start)+' → '+esc(item.end)+'（'+esc(item.cabin)+'）</p>'+
                (free?'<p class="text-sm text-textGray mt-1">恶劣天气航班取消，为您提供<strong class="text-success">免费改签（免差价）</strong>。</p>':'<p class="text-sm text-textGray mt-1">同等舱位免费改签一次，差价多退少补；特价机票不可退改。</p>');
            document.getElementById("changeModal").classList.remove("hidden");
        }
        function confirmChange(){
            let orders=loadOrders(),item=orders[changeIdx];
            const date=document.getElementById("changeDate").value;
            const f=searchFlights({start:item.start,end:item.end,date:date})[0];
            if(!f){showToast("该日期暂无可用航班，请重新选择。");return;}
            item.flightNo=f.no;item.date=f.date;item.time=f.time;
            item.checkedIn=false;delete item.seat;delete item.gate;delete item.boardTime;
            if(changeFree){
                // 恶劣天气取消：免费改签，不占用免费改签机会、免差价
                delete item.weatherRisk;delete item.weatherReason;delete item.riskEvalAt;delete item.riskResult;delete item.compensated;
                item.status='已完成';
                saveOrders(orders);
                document.getElementById("changeModal").classList.add("hidden");
                changeFree=false;
                renderOrderList();
                showToast("免费改签成功！已为您改至 "+f.date+" "+f.time+"，免收差价。");
                return;
            }
            item.changed=true;
            saveOrders(orders);
            document.getElementById("changeModal").classList.add("hidden");
            renderOrderList();
            showToast("改签成功！已为您改至 "+f.date+" "+f.time+"，票价无差价。");
        }
        function closeChange(){document.getElementById("changeModal").classList.add("hidden");changeFree=false;}
        // ============ 恶劣天气：航班可能取消 ============
        // 支付后 30 秒，80% 概率触发取消；一次性判定并落盘
        function evalWeatherRisk(){
            let orders=loadOrders(),changed=false;
            orders.forEach(item=>{
                if(item.weatherRisk&&!item.riskResult&&!item.compensated){
                    if(Date.now()>=(item.riskEvalAt||0)){
                        item.riskResult=Math.random()<0.8?'canceled':'ok';
                        if(item.riskResult==='canceled')item.status='恶劣天气取消';
                        changed=true;
                    }
                }
            });
            if(changed){saveOrders(orders);renderOrderList();}
            return changed;
        }
        function tickRisk(){
            const orders=loadOrders();
            document.querySelectorAll('[data-risk-remain]').forEach(el=>{
                const o=orders.find(x=>x.orderId===el.dataset.riskRemain);
                const remain=o&&o.riskEvalAt?Math.max(0,Math.ceil((o.riskEvalAt-Date.now())/1000)):0;
                if(el.textContent!=remain)el.textContent=remain;
            });
            evalWeatherRisk();
        }
        // 补偿方案
        let compIdx=null;
        function openCompensation(idx){
            let orders=loadOrders(),item=orders[idx];
            if(!item)return;
            compIdx=idx;
            const base=item.payPrice!=null?item.payPrice:item.price;
            document.getElementById("compInfo").innerHTML=
                '<p>订单：'+esc(item.orderId)+'</p>'+
                '<p>航班：'+esc(item.flightNo)+'　'+esc(item.start)+'→'+esc(item.end)+'</p>'+
                '<p>实付金额：<span class="text-gold font-bold">¥'+base+'</span></p>'+
                '<p class="text-sm text-textGray mt-1">因恶劣天气航班取消，以下补偿方案任选其一。</p>';
            document.getElementById("compModal").classList.remove("hidden");
        }
        function closeCompensation(){document.getElementById("compModal").classList.add("hidden");}
        function chooseCompensation(type){
            let orders=loadOrders(),item=orders[compIdx];
            if(!item){closeCompensation();return;}
            const base=item.payPrice!=null?item.payPrice:item.price;
            let msg='';
            if(type==='refund'){
                item.status='已补偿';item.compensated='refund';item.refundAmount=base;item.fee=0;
                msg='已为您全额退款 ¥'+base+'，将原路退回支付账户。';
                const m=getMember();
                if(m&&item.memberCardNo&&item.milesEarned){
                    m.miles=Math.max(0,(m.miles||0)-item.milesEarned);
                    m.totalMiles=Math.max(0,(m.totalMiles||0)-item.milesEarned);
                    m.level=ffpLevel(m.totalMiles).cur.name;
                    saveMember(m);
                }
            }else if(type==='coupon'){
                const cps=getCoupons();
                cps.push({code:"C"+String(Date.now()).slice(-6),value:100,status:"未使用",createdAt:Date.now()});
                saveCoupons(cps);
                item.status='已补偿';item.compensated='coupon';
                msg='已发放 ¥100 补偿优惠券至您的账户，可在购物车结算时使用。';
            }else if(type==='miles'){
                const m=getMember();
                if(!m){showToast("请先登录会员账户后，再选择里程补偿方案。");return;}
                m.miles=(m.miles||0)+2000;
                m.totalMiles=(m.totalMiles||0)+2000;
                m.level=ffpLevel(m.totalMiles).cur.name;
                saveMember(m);
                item.status='已补偿';item.compensated='miles';
                msg='已补偿 2000 里程至您的会员账户。';
            }
            item.checkedIn=false;delete item.seat;delete item.gate;delete item.boardTime;
            delete item.weatherRisk;delete item.weatherReason;delete item.riskEvalAt;delete item.riskResult;
            saveOrders(orders);
            document.getElementById("compModal").classList.add("hidden");
            renderOrderList();
            showToast(msg);
        }
        // ---- 升舱/降舱：价格多退少补 ----
        function getFlightPrice(item){
            const f=findFlight(item.flightNo);
            if(f&&f.price)return f.price;
            const alt=searchFlights({start:item.start,end:item.end})[0];
            return alt?alt.price:null;
        }
        function openCabinChange(idx){
            const orders=loadOrders(),item=orders[idx];
            if(item.type==="railair"){showToast("空铁联运暂不支持在线升降舱，如需调整请联系客服。");return;}
            if(resolveStatus(item)==='已退票'){showToast("该订单已退票，无法调整舱位。");return;}
            if(resolveStatus(item)==='支付处理中'){showToast("订单支付处理中，请稍候再操作。");return;}
            const price=getFlightPrice(item);
            if(!price){showToast("未获取到该航班舱位价格，暂无法调整。");return;}
            cabinIdx=idx;cabinTargetKey=null;
            const curKey=CABIN_KEY[item.cabin]||'eco';
            const curPrice=price[curKey];
            const base=item.payPrice!=null?item.payPrice:item.price;
            document.getElementById("cabinInfo").innerHTML=
                '<p>航班：'+esc(item.flightNo)+'　'+esc(item.start)+'→'+esc(item.end)+'</p>'+
                '<p>当前舱位：<span class="text-gold font-bold">'+esc(item.cabin)+'</span>　标价 ¥'+curPrice+'　实付 ¥'+base+'</p>';
            document.getElementById("cabinOptions").innerHTML=CABIN_ORDER.map(key=>{
                const name=CABIN_NAME[key],p=price[key];
                const diff=Math.round(p-curPrice);
                const same=key===curKey;
                const diffTxt=same?'（当前舱位）':(diff>0?'<span class="text-danger">补差价 +¥'+diff+'</span>':'<span class="text-success">退差价 -¥'+Math.abs(diff)+'</span>');
                return '<label class="flex items-center gap-3 bg-black/40 border border-gold/20 rounded-global px-4 py-3 cursor-pointer hover:border-gold transition-colors'+(same?' opacity-60':'')+'">'+
                    '<input type="radio" name="cabinPick" value="'+key+'" data-diff="'+diff+'" data-price="'+p+'" '+(same?'disabled':'')+' onchange="pickCabin(this)">'+
                    '<span class="font-bold flex-1">'+name+'</span>'+
                    '<span class="text-sm text-textGray">¥'+p+'</span>'+
                    '<span class="text-xs">'+diffTxt+'</span>'+
                    '</label>';
            }).join('');
            document.getElementById("cabinSummary").innerHTML='<p class="text-textGray">选择目标舱位后显示差价：升舱需补差价，降舱退回差价（多退少补）。</p>';
            const btn=document.getElementById("cabinConfirmBtn");
            btn.disabled=true;
            btn.className="flex-1 bg-gold text-primary font-bold py-3 rounded-global btn-hover opacity-50 cursor-not-allowed";
            btn.innerText="请选择舱位";
            document.getElementById("cabinModal").classList.remove("hidden");
        }
        function pickCabin(el){
            const orders=loadOrders(),item=orders[cabinIdx];
            const key=el.value,diff=Number(el.dataset.diff);
            const base=item.payPrice!=null?item.payPrice:item.price;
            const newPay=base+diff;
            cabinTargetKey=key;
            document.getElementById("cabinSummary").innerHTML=
                '<p>当前实付：¥'+base+'　→　新舱位：'+CABIN_NAME[key]+'（新实付 ¥'+newPay+'）</p>'+
                (diff>0?'<p class="text-danger font-bold text-lg mt-1">需补差价：+¥'+diff+'</p>'
                       :'<p class="text-success font-bold text-lg mt-1">退回差价：-¥'+Math.abs(diff)+'</p>');
            const btn=document.getElementById("cabinConfirmBtn");
            btn.disabled=false;
            btn.className="flex-1 bg-gold text-primary font-bold py-3 rounded-global btn-hover";
            btn.innerText=diff>0?'确认升舱并补差价 ¥'+diff:'确认降舱并退回差价 ¥'+Math.abs(diff);
        }
        function confirmCabinChange(){
            if(!cabinTargetKey)return;
            const orders=loadOrders(),item=orders[cabinIdx];
            const price=getFlightPrice(item);
            const curKey=CABIN_KEY[item.cabin]||'eco';
            const diff=Math.round(price[cabinTargetKey]-price[curKey]);
            const base=item.payPrice!=null?item.payPrice:item.price;
            const newPay=Math.max(0,base+diff);
            const oldMiles=item.milesEarned||0;
            const newMiles=Math.round(newPay);
            const fromCabin=item.cabin;
            const toCabin=CABIN_NAME[cabinTargetKey];
            const diffAmt=Math.abs(diff);
            showConfirm('确认将舱位由【'+fromCabin+'】调整至【'+toCabin+'】？<br>'+(diff>0?'需补差价 ¥'+diffAmt:'退回差价 ¥'+diffAmt)+'（多退少补），调整后原座位将释放，需重新值机。',function(){
                item.cabin=toCabin;
                item.price=price[cabinTargetKey];
                item.payPrice=newPay;
                item.milesEarned=newMiles;
                item.cabinChange={type:diff>0?'upgrade':'downgrade',fromCabin:fromCabin,toCabin:toCabin,diff:diffAmt,oldPayPrice:base,newPayPrice:newPay,changedAt:Date.now()};
                item.checkedIn=false;delete item.seat;delete item.gate;delete item.boardTime;delete item.checkinTime;
                saveOrders(orders);
                const m=getMember();
                if(m&&item.memberCardNo){
                    const delta=newMiles-oldMiles;
                    if(delta>0){m.miles=(m.miles||0)+delta;m.totalMiles=(m.totalMiles||0)+delta;}
                    else if(delta<0){m.miles=Math.max(0,(m.miles||0)+delta);m.totalMiles=Math.max(0,(m.totalMiles||0)+delta);}
                    m.level=ffpLevel(m.totalMiles).cur.name;
                    saveMember(m);
                }
                document.getElementById("cabinModal").classList.add("hidden");
                renderOrderList();
                showToast("舱位调整成功！"+(diff>0?'已补差价 ¥'+diffAmt+'，':'已退回差价 ¥'+diffAmt+'，')+"请重新选择座位办理值机。");
            });
        }
        function closeCabinChange(){document.getElementById("cabinModal").classList.add("hidden");cabinTargetKey=null;}
        renderOrderList();
        // 天气风险评估：对超期未判定的订单执行一次判定（30秒/80%概率）
        evalWeatherRisk();
        // 若仍有“支付处理中”的订单，6 秒后自动重渲染一次（状态始终按创建时间实时计算，不写死）
        setTimeout(function(){if(loadOrders().some(o=>o.status==='支付处理中'))renderOrderList();},6000);
        // 天气倒计时每秒刷新
        setInterval(tickRisk,1000);
    </script>
</body>
</html>
