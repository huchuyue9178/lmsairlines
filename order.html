<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 | 老牧师航空</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="assets/tailwind-config.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="text-textDark">
    <div id="siteHeader"></div>
    <main class="pt-24 pb-16 container mx-auto px-4">
        <h2 class="text-[26px] font-bold text-gold mb-8">我的订单</h2>
        <div id="orderList"></div>
    </main>
    <div id="changeModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-card card-gold w-full max-w-lg p-6 rounded-global">
            <h3 class="text-xl font-bold text-gold mb-4">免费改签</h3>
            <div id="changeInfo" class="mb-4 text-sm"></div>
            <div><label class="block mb-1">选择新出发日期</label><select id="changeDate" class="w-full border px-4 py-3 rounded-global"></select></div>
            <div class="flex gap-4 mt-6">
                <button onclick="closeChange()" class="flex-1 border py-3 rounded-global">取消</button>
                <button onclick="confirmChange()" class="flex-1 bg-gold text-primary font-bold py-3 rounded-global btn-hover">确认改签</button>
            </div>
        </div>
    </div>
    <div id="siteFooter"></div>
    <script src="assets/data.js"></script>
    <script src="assets/common.js"></script>
    <script>
        let changeIdx=null;

        // 按起飞时间窗口计算手续费比例（与政策页一致）
        function refundRate(item){
            const depMs=parseFlightTime(item.date,item.time).depMs;
            const hoursLeft=(depMs-Date.now())/3600000;
            if(hoursLeft>24)return 0.15;
            if(hoursLeft>4)return 0.30;
            return 0.50;
        }
        function renderOrderList(){
            let orders=loadOrders(),d=document.getElementById("orderList");
            if(orders.length===0){d.innerHTML='<div class="bg-card card-gold p-6 rounded-global shadow-lg">暂无订单，请前往机票预订页面购买航班。</div>';return;}
            let h="";
            orders.forEach((item,index)=>{
                const isRA=item.type==="railair";
                const status=resolveStatus(item);
                const sc=status==='已退票'?'text-danger':status==='已完成'?'text-success':'text-orange-500';
                let actions='';
                if(status==='已退票'){
                    actions='<div class="mt-4 text-textGray">已退票，手续费 ¥'+(item.fee||0)+'，已退还 ¥'+(item.refundAmount||0)+'</div>';
                }else if(status==='支付处理中'){
                    actions='<div class="mt-4 text-textGray text-sm">订单支付处理中，约5秒后自动完成，请稍候刷新查看。</div>';
                }else{
                    const rate=refundRate(item);
                    const base=(item.payPrice!=null?item.payPrice:item.price);
                    const fee=Math.round(base*rate);
                    const refund=base-fee;
                    const changeBtn=isRA
                        ?'<span class="self-center text-textGray text-sm">空铁联运暂不支持在线改签，如需调整行程请联系客服</span>'
                        :'<button onclick="openChange('+index+')" class="px-4 py-2 bg-primary text-white rounded-global btn-hover"'+(item.changed?' disabled style="opacity:.5;cursor:not-allowed"':'')+'>'+(item.changed?'已改签（免费机会已用）':'免费改签')+'</button>';
                    const ckLink='checkin.html?orderId='+encodeURIComponent(item.orderId);
                    const ckBtn=item.checkedIn
                        ?'<button onclick="location.href=\''+ckLink+'\'" class="px-4 py-2 bg-gold text-primary font-bold rounded-global btn-hover">已值机 · '+esc(item.seat)+'（查看登机牌）</button>'
                        :'<button onclick="location.href=\''+ckLink+'\'" class="px-4 py-2 bg-gold text-primary font-bold rounded-global btn-hover"><i class="fa fa-qrcode"></i> 在线值机</button>';
                    actions='<div class="mt-4 flex flex-wrap gap-3">'+
                        changeBtn+
                        '<button onclick="refundOrder('+index+')" class="px-4 py-2 bg-danger text-white rounded-global btn-hover">申请退票（手续费'+rate*100+'% · 退¥'+refund+'）</button>'+
                        ckBtn+
                        '</div>';
                }
                let routeInfo=isRA
                    ?'<p class="text-gold font-bold"><i class="fa fa-train"></i> 空铁联运：'+esc(item.start)+'→'+esc(item.end)+'</p>'+
                    '<p class="mt-1"><i class="fa fa-plane text-gold"></i> 航班 '+esc(item.flightNo)+'：'+esc(item.flightStart)+'→'+esc(item.flightEnd)+'</p>'+
                    '<p class="text-sm text-textGray ml-5">'+esc(item.flightDate)+' '+esc(item.flightTime)+'</p>'+
                    '<p><i class="fa fa-train text-gold"></i> 高铁 '+esc(item.trainNo)+'：'+esc(item.trainFrom)+'→'+esc(item.trainTo)+'　'+esc(item.trainTime)+'（'+esc(item.trainDur)+'）</p>'
                    :'<p>航班：'+esc(item.flightNo)+' &nbsp;&nbsp; '+esc(item.start)+'→'+esc(item.end)+'</p>'+
                    '<p>日期：'+esc(item.date)+' '+esc(item.time)+'</p>';
                h+='<div class="bg-card card-gold p-6 rounded-global shadow-lg mb-4">'+
                    '<div class="flex justify-between"><span>订单号：'+esc(item.orderId)+'</span><span class="'+sc+'">'+status+'</span></div>'+
                    '<hr class="my-3">'+
                    routeInfo+
                    '<p>舱位：'+esc(item.cabin)+'</p>'+
                    '<p>乘客：'+esc(item.username)+'</p>'+
                    '<p>票价：¥'+item.price+(item.payPrice!=null&&item.payPrice!==item.price?'（实付 ¥'+item.payPrice+(item.couponValue?'，券抵扣 ¥'+item.couponValue:'')+'）':'')+(isRA?'（含高铁二等座）':'')+'</p>'+
                    (item.memberCardNo?'<p class="text-gold">会员 '+esc(item.memberCardNo)+' · 获得里程 +'+(item.milesEarned||0)+'</p>':'')+
                    actions+
                    '</div>';
            });
            d.innerHTML=h;
        }
        function refundOrder(idx){
            let orders=loadOrders(),item=orders[idx];
            if(!item)return;
            if(resolveStatus(item)==='已退票'){showToast("该订单已退票，无需重复操作。");return;}
            const base=(item.payPrice!=null?item.payPrice:item.price);
            const rate=refundRate(item),fee=Math.round(base*rate),refund=base-fee;
            showConfirm('确认申请退票？<br>按当前起飞时间窗口，手续费 ¥'+fee+'（票价'+rate*100+'%），实退 ¥'+refund+'。',function(){
                item.status="已退票";item.fee=fee;item.refundAmount=refund;
                item.checkedIn=false;delete item.seat;delete item.gate;delete item.boardTime;
                saveOrders(orders);
                // 回退该订单已累积的会员里程（防"购票刷里程再退票"）
                let milesBack=0;
                const m=getMember();
                if(m&&item.memberCardNo&&item.milesEarned){
                    milesBack=item.milesEarned;
                    m.miles=Math.max(0,(m.miles||0)-milesBack);
                    m.totalMiles=Math.max(0,(m.totalMiles||0)-milesBack);
                    m.level=ffpLevel(m.totalMiles).cur.name;
                    saveMember(m);
                }
                renderOrderList();
                showToast("退票成功"+(milesBack?"，已回退 "+milesBack+" 里程。":"。"));
            });
        }
        function openChange(idx){
            let orders=loadOrders(),item=orders[idx];
            if(item.type==="railair"){showToast("空铁联运暂不支持在线改签，如需调整行程请联系客服。");return;}
            if(item.changed){showToast("该订单已免费改签过一次，机会已用完。");return;}
            changeIdx=idx;
            const dates=[...new Set(searchFlights({start:item.start,end:item.end}).map(f=>f.date))].sort();
            document.getElementById("changeDate").innerHTML=dates.map(d=>'<option value="'+d+'">'+d+'</option>').join('');
            document.getElementById("changeInfo").innerHTML='<p>原航班：'+esc(item.flightNo)+'（'+esc(item.date)+' '+esc(item.time)+'）</p><p>航线：'+esc(item.start)+' → '+esc(item.end)+'（'+esc(item.cabin)+'）</p><p class="text-sm text-textGray mt-1">同等舱位免费改签一次，差价多退少补；特价机票不可退改。</p>';
            document.getElementById("changeModal").classList.remove("hidden");
        }
        function confirmChange(){
            let orders=loadOrders(),item=orders[changeIdx];
            const date=document.getElementById("changeDate").value;
            const f=searchFlights({start:item.start,end:item.end,date:date})[0];
            if(!f){showToast("该日期暂无可用航班，请重新选择。");return;}
            item.flightNo=f.no;item.date=f.date;item.time=f.time;item.changed=true;
            item.checkedIn=false;delete item.seat;delete item.gate;delete item.boardTime;
            saveOrders(orders);
            document.getElementById("changeModal").classList.add("hidden");
            renderOrderList();
            showToast("改签成功！已为您改至 "+f.date+" "+f.time+"，票价无差价。");
        }
        function closeChange(){document.getElementById("changeModal").classList.add("hidden");}
        renderOrderList();
        // 若仍有“支付处理中”的订单，6 秒后自动重渲染一次（状态始终按创建时间实时计算，不写死）
        setTimeout(function(){if(loadOrders().some(o=>o.status==='支付处理中'))renderOrderList();},6000);
    </script>
</body>
</html>
