<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部特价 | 老牧师航空</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="assets/tailwind-config.js?v=20260920u"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=20260920u">
</head>
<body class="text-textDark">
    <div class="bg-layer" aria-hidden="true"></div>
    <div id="siteHeader"></div>
    <main class="pt-28 pb-16 container mx-auto px-4 max-w-6xl">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div>
                <h2 class="text-[28px] font-bold text-textDark mb-1">全部特价机票</h2>
                <p class="text-textGray text-sm">上海出发 · 16 个热门目的地，低至 ¥301 起</p>
            </div>
            <div class="flex items-center gap-1 p-1 rounded-full" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.7)">
                <button id="dealTabCn" onclick="switchDeal('cn')" class="deal-tab deal-tab-on px-5 py-1.5 rounded-full text-sm font-semibold">国内</button>
                <button id="dealTabIntl" onclick="switchDeal('intl')" class="deal-tab px-5 py-1.5 rounded-full text-sm font-semibold">国际及港澳台</button>
            </div>
        </div>
        <div class="bg-card card-gold p-6 md:p-8 rounded-big shadow-xl">
            <div id="dealGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>
    </main>
    <div id="siteFooter"></div>
    <script src="assets/data.js?v=20260920u"></script>
    <script src="assets/common.js?v=20260920u"></script>
    <script>
        const DEALS={
            cn:[
                {city:"南京",img:"assets/deals/nanjing.webp",price:301},
                {city:"温州",img:"assets/deals/wenzhou.webp",price:321},
                {city:"武汉",img:"assets/deals/wuhan.webp",price:351},
                {city:"合肥",img:"assets/deals/hefei.webp",price:341},
                {city:"杭州",img:"assets/deals/hangzhou.webp",price:401},
                {city:"成都",img:"assets/deals/chengdu.webp",price:521},
                {city:"西安",img:"assets/deals/xian.webp",price:451},
                {city:"广州",img:"assets/deals/guangzhou.webp",price:531}
            ],
            intl:[
                {city:"东京",img:"assets/deals/tokyo.webp",price:1501},
                {city:"巴黎",img:"assets/deals/paris.webp",price:4201},
                {city:"伦敦",img:"assets/deals/london.webp",price:4501},
                {city:"新加坡",img:"assets/deals/singapore.webp",price:2001},
                {city:"香港",img:"assets/deals/hongkong.webp",price:1001},
                {city:"曼谷",img:"assets/deals/bangkok.webp",price:1201},
                {city:"悉尼",img:"assets/deals/sydney.webp",price:3601},
                {city:"迪拜",img:"assets/deals/dubai.webp",price:3801}
            ]
        };
        let dealTab='cn';
        function dealCard(d,i){
            return '<button type="button" class="deal-card text-left overflow-hidden cursor-pointer group deal-in" style="animation-delay:'+(i*70)+'ms" onclick="location.href=\'booking.html?start=上海&end='+encodeURIComponent(d.city)+'\'">'+
                '<div class="deal-imgwrap">'+
                    '<img src="'+d.img+'" alt="'+d.city+'" class="deal-img" loading="lazy">'+
                    '<div class="deal-mask"></div>'+
                    '<span class="deal-price">¥'+d.price+'起</span>'+
                    '<div class="deal-info">'+
                        '<p class="deal-from">上海 出发</p>'+
                        '<p class="deal-city">'+d.city+'</p>'+
                    '</div>'+
                '</div>'+
            '</button>';
        }
        function renderDeals(tab){
            dealTab=tab;
            const grid=document.getElementById("dealGrid");
            grid.innerHTML=DEALS[tab].map(dealCard).join('');
        }
        function switchDeal(tab){
            if(tab===dealTab)return;
            document.getElementById("dealTabCn").classList.toggle("deal-tab-on",tab==="cn");
            document.getElementById("dealTabIntl").classList.toggle("deal-tab-on",tab==="intl");
            renderDeals(tab);
        }
        renderDeals('cn');
    </script>
</body>
</html>
