<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线客服 | 老牧师航空</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="assets/tailwind-config.js?v=20260920zz"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=20260920zz">
    <style>
        /* 客服大弹窗 */
        .chat-mask{
            position:fixed;inset:0;
            background:rgba(58,74,92,0.35);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            z-index:80;
            display:flex;align-items:center;justify-content:center;
            opacity:0;pointer-events:none;
            transition:opacity .3s ease;
        }
        .chat-mask.show{opacity:1;pointer-events:auto;}
        .chat-modal{
            width:min(720px,92vw);
            height:min(680px,88vh);
            background:rgba(255,255,255,0.75);
            backdrop-filter:blur(30px) saturate(180%);
            -webkit-backdrop-filter:blur(30px) saturate(180%);
            border:1px solid rgba(255,255,255,0.8);
            border-radius:28px;
            box-shadow:0 30px 80px rgba(74,90,110,0.3);
            display:flex;flex-direction:column;
            overflow:hidden;
            transform:scale(.92) translateY(20px);
            transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
        }
        .chat-mask.show .chat-modal{transform:scale(1) translateY(0);}
        .chat-modal-head{
            padding:18px 24px;
            background:linear-gradient(135deg,#4a5a6e,#6b7e92);
            color:#fff;
            display:flex;justify-content:space-between;align-items:center;
        }
        .chat-modal-body{flex:1;overflow-y:auto;padding:20px;background:linear-gradient(180deg,rgba(216,223,230,0.5),rgba(242,244,242,0.5));}
        .chat-modal-input{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.6);background:rgba(255,255,255,0.5);display:flex;gap:10px;}
        .msg-bot{background:rgba(255,255,255,0.85);padding:12px 16px;border-radius:18px 18px 18px 4px;box-shadow:0 4px 12px rgba(74,90,110,0.08);max-width:75%;}
        .msg-user{background:linear-gradient(135deg,#4a5a6e,#6b7e92);color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;box-shadow:0 4px 12px rgba(74,90,110,0.2);max-width:75%;margin-left:auto;}
        .field-err{border-color:#d9534f !important;background:#fff5f5;}
    </style>
</head>
<body class="text-textDark">
    <div id="siteHeader"></div>
    <main class="pt-24 pb-16 container mx-auto px-4">
        <h2 class="text-[26px] font-bold text-gold mb-8">客服中心</h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-card card-gold p-6 rounded-global shadow-lg">
                <h3 class="text-xl font-bold text-gold mb-4">人工客服</h3>
                <p class="text-lg mb-3"><i class="fa fa-phone text-gold mr-2"></i>客服热线：400-888-9999</p>
                <p class="text-textGray mb-6">服务时间：每日 07:00 — 23:00</p>
                <button onclick="toggleChat()" class="btn-hover w-full bg-gold text-primary font-bold py-3 rounded-global">开启在线智能客服</button>
            </div>
            <div class="bg-card card-gold p-6 rounded-global shadow-lg">
                <h3 class="text-xl font-bold text-gold mb-4">投诉与建议</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-textGray mb-1">您的姓名 <span class="text-red-500">*</span></label>
                        <input id="fbName" type="text" class="w-full border rounded-global px-4 py-3 focus:border-gold outline-none" placeholder="请输入您的姓名">
                    </div>
                    <div>
                        <label class="block text-sm text-textGray mb-1">联系电话 <span class="text-red-500">*</span></label>
                        <input id="fbPhone" type="tel" class="w-full border rounded-global px-4 py-3 focus:border-gold outline-none" placeholder="请输入您的联系电话">
                    </div>
                    <div>
                        <label class="block text-sm text-textGray mb-1">反馈内容 <span class="text-red-500">*</span></label>
                        <textarea id="fbMsg" rows="4" class="w-full border rounded-global px-4 py-3 focus:border-gold outline-none" placeholder="请详细描述您遇到的问题或建议"></textarea>
                    </div>
                    <button onclick="submitFeedback()" class="btn-hover w-full bg-gold text-white font-bold py-3 rounded-global">提交反馈</button>
                </div>
            </div>
        </div>
        <div class="bg-card card-gold p-6 rounded-global shadow-lg mt-8">
            <h3 class="text-xl font-bold text-gold mb-4">常见自助问题</h3>
            <div class="space-y-3">
                <p class="font-medium">Q：如何办理退票改签？</p>
                <p class="text-textGray">A：登录【我的订单】页面，可申请退票或免费改签。退票按起飞时间窗口收取手续费（起飞前24小时以上15%、4-24小时30%、4小时以内及起飞后50%）；同等舱位免费改签一次。</p>
                <p class="font-medium">Q：行李超重收费标准？</p>
                <p class="text-textGray">A：行李收费详情查看【服务指南-行李托运政策】。</p>
                <p class="font-medium">Q：如何开具行程单发票？</p>
                <p class="text-textGray">A：航班出行结束后，前往订单详情页申请开具。</p>
            </div>
        </div>
    </main>

    <!-- 客服大弹窗（屏幕正中间） -->
    <div id="chatMask" class="chat-mask">
        <div class="chat-modal">
            <div class="chat-modal-head">
                <span class="font-bold text-lg"><i class="fa fa-comments-o mr-2"></i>老牧师航空智能客服</span>
                <button onclick="toggleChat()" class="text-2xl leading-none hover:opacity-80">&times;</button>
            </div>
            <div id="chatBody" class="chat-modal-body space-y-3"></div>
            <div class="chat-modal-input">
                <input id="chatInput" type="text" class="flex-1 border rounded-global px-4 py-2 outline-none focus:border-gold bg-white/70" placeholder="请输入您的问题…">
                <button onclick="sendChat()" class="bg-gold text-primary font-bold px-5 py-2 rounded-global btn-hover">发送</button>
            </div>
        </div>
    </div>

    <div id="siteFooter"></div>
    <script src="assets/data.js?v=20260920zz"></script>
    <script src="assets/common.js?v=20260920zz"></script>
    <script>
        const chatBody=document.getElementById("chatBody");
        function botReply(text){
            const t=text.toLowerCase();
            if(t.includes("退票")||t.includes("退款"))return "退票请在【我的订单】中提交申请。退票按起飞时间窗口收取手续费：起飞前24小时以上15%、4-24小时30%、4小时以内及起飞后50%。";
            if(t.includes("改签"))return "改签请前往【我的订单】操作。同等舱位可免费改签一次，差价多退少补；特价机票不可退改。";
            if(t.includes("行李"))return "行李额度：经济舱20KG / 超经25KG / 商务30KG / 头等40KG，超重按对应航线票价的1.5%/公斤收取。详见【服务指南】。";
            if(t.includes("人工"))return "如需人工服务，请拨打客服热线 400-888-9999（每日 07:00-23:00）。";
            if(t.includes("登机")||t.includes("值机"))return "国内航班建议起飞前2小时到达机场，起飞前45分钟停止值机；国际航班建议提前3小时，并携带有效护照签证。";
            return "您好，我是智能客服助手。您可以咨询退票、改签、行李、登机等问题，或输入\"人工\"转接人工客服。";
        }
        function appendMsg(who,text){
            const d=document.createElement("div");
            d.className=who==='bot'?'msg-bot':'msg-user';
            d.textContent=text;
            chatBody.appendChild(d);
            chatBody.scrollTop=chatBody.scrollHeight;
        }
        function toggleChat(){
            const mask=document.getElementById("chatMask");
            mask.classList.toggle("show");
            if(mask.classList.contains("show")&&chatBody.children.length===0){
                appendMsg('bot','您好，欢迎来到老牧师航空！请问有什么可以帮您？');
            }
            if(mask.classList.contains("show")){
                document.getElementById("chatInput").focus();
            }
        }
        function sendChat(){
            const inp=document.getElementById("chatInput");
            const t=inp.value.trim();
            if(!t)return;
            appendMsg('user',t);
            inp.value="";
            setTimeout(()=>{appendMsg('bot',botReply(t));},300);
        }
        document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat();});
        // 点遮罩关闭
        document.getElementById("chatMask").addEventListener("click",e=>{
            if(e.target.id==="chatMask") toggleChat();
        });

        // 意见反馈校验
        function submitFeedback(){
            const name=document.getElementById("fbName");
            const phone=document.getElementById("fbPhone");
            const msg=document.getElementById("fbMsg");
            let err=false;
            [name,phone,msg].forEach(f=>f.classList.remove('field-err'));
            if(!name.value.trim()){name.classList.add('field-err');err=true;}
            if(!phone.value.trim()){phone.classList.add('field-err');err=true;}
            else if(!/^1[3-9]\d{9}$/.test(phone.value.trim())){
                alert("请输入正确的 11 位手机号");
                phone.classList.add('field-err');return;
            }
            if(!msg.value.trim()){msg.classList.add('field-err');err=true;}
            if(err){
                alert("请完整填写姓名、联系电话与反馈内容后再提交");
                return;
            }
            alert("反馈已提交，感谢您的建议！");
            name.value="";phone.value="";msg.value="";
        }
    </script>
</body>
</html>
