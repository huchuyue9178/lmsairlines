<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部航线 | 老牧师航空</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="assets/tailwind-config.js?v=20260920bbb"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=20260920bbb">
</head>
<body class="text-textDark">
    <div id="siteHeader"></div>
    <main class="pt-28 pb-16 container mx-auto px-4 max-w-6xl">
        <h2 class="text-[28px] font-bold text-gold mb-2">全部航线</h2>
        <p class="text-textGray text-sm mb-8">114 条精选航线，覆盖全球热门与小众目的地</p>
        <div class="bg-card card-gold p-6 md:p-8 rounded-big shadow-xl">
            <h4 class="font-semibold text-textDark/80 mt-2 mb-4">🇨🇳 国内热门干线</h4>
            <div id="routesDomestic" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8"></div>
            <h4 class="font-semibold text-textDark/80 mb-4">🏝️ 国内旅游城市</h4>
            <div id="routesTravel" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8"></div>
            <h4 class="font-semibold text-textDark/80 mb-4">🌏 国际及地区航线</h4>
            <div id="routesIntl" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8"></div>
            <h4 class="font-semibold text-textDark/80 mb-4">✨ 小众宝藏目的地</h4>
            <div id="routesNiche" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </main>
    <div id="siteFooter"></div>
    <script src="assets/data.js?v=20260920bbb"></script>
    <script src="assets/common.js?v=20260920bbb"></script>
    <script src="assets/routes-data.js?v=20260920bbb"></script>
    <script>
        function quickSearch(start,end){location.href=`booking.html?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;}
        // 目的地城市 → 图片映射
        const CITY_IMG={
            "上海":"assets/routes/shanghai.webp","北京":"assets/routes/beijing.webp","广州":"assets/deals/guangzhou.webp","深圳":"assets/routes/shenzhen.webp",
            "成都":"assets/deals/chengdu.webp","重庆":"assets/routes/chongqing.webp","杭州":"assets/deals/hangzhou.webp",
            "西安":"assets/deals/xian.webp","武汉":"assets/deals/wuhan.webp","长沙":"assets/routes/changsha.webp",
            "昆明":"assets/routes/kunming.webp","三亚":"assets/routes/sanya.webp","丽江":"assets/routes/lijiang.webp",
            "厦门":"assets/routes/xiamen.webp","青岛":"assets/routes/qingdao.webp","大连":"assets/routes/dalian.webp",
            "桂林":"assets/routes/guilin.webp","哈尔滨":"assets/routes/harbin.webp",
            "纽约":"assets/routes/newyork.webp","洛杉矶":"assets/routes/la.webp","伦敦":"assets/deals/london.webp",
            "巴黎":"assets/deals/paris.webp","迪拜":"assets/deals/dubai.webp","法兰克福":"assets/routes/frankfurt.webp",
            "新加坡":"assets/routes/singapore.webp","悉尼":"assets/routes/sydney.webp","东京":"assets/routes/tokyo.webp",
            "首尔":"assets/routes/seoul.webp","曼谷":"assets/routes/bangkok.webp","香港":"assets/routes/hongkong.webp",
            "台北":"assets/routes/taipei.webp",
            "贵阳":"assets/routes/guiyang.webp","珠海":"assets/routes/zhuhai.webp","舟山":"assets/routes/zhoushan.webp",
            "呼和浩特":"assets/routes/hohhot.webp","温州":"assets/routes/wenzhou.webp","大阪":"assets/routes/osaka.webp",
            "澳门":"assets/routes/macau.webp","喀什":"assets/routes/kashgar.webp","伊宁":"assets/routes/yining.webp",
            "阿勒泰":"assets/routes/altay.webp","漠河":"assets/routes/mohe.webp","长白山":"assets/routes/changbaishan.webp",
            "稻城":"assets/routes/daocheng.webp","林芝":"assets/routes/linzhi.webp","西双版纳":"assets/routes/banna.webp",
            "泉州":"assets/routes/quanzhou.webp","北海":"assets/routes/beihai.webp","西宁":"assets/routes/xining.webp",
            "香格里拉":"assets/routes/shangrila.webp","敦煌":"assets/routes/dunhuang.webp","芽庄":"assets/routes/nhatrang.webp",
            "富国岛":"assets/routes/phuquoc.webp","清迈":"assets/routes/chiangmai.webp","普吉岛":"assets/routes/phuket.webp",
            "暹粒":"assets/routes/siemreap.webp","岘港":"assets/routes/danang.webp"
        };
        // 缺图城市的渐变色（按城市名 hash 出柔和雾色）
        const FALLBACKS=[
            "linear-gradient(135deg,#a8b8c8 0%,#c8d8e8 100%)",
            "linear-gradient(135deg,#b8a8c8 0%,#d8c8e8 100%)",
            "linear-gradient(135deg,#a8c8b8 0%,#c8e8d8 100%)",
            "linear-gradient(135deg,#c8b8a8 0%,#e8d8c8 100%)",
            "linear-gradient(135deg,#b8c8d8 0%,#d8e8f8 100%)",
            "linear-gradient(135deg,#c8b8b8 0%,#e8d8d8 100%)"
        ];
        function routeCard(r,i){
            const from=r[0],to=r[1],info=r[2];
            const img=CITY_IMG[to];
            const bg=img? '' : FALLBACKS[(to.charCodeAt(0))%FALLBACKS.length];
            const inner=img
                ? '<img src="'+img+'" alt="'+to+'" class="deal-img" loading="lazy">'
                : '<div style="position:absolute;inset:0;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:rgba(255,255,255,0.85);letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,0.15)">'+to+'</div>';
            return '<button type="button" class="deal-card text-left overflow-hidden cursor-pointer group deal-in" style="animation-delay:'+((i%9)*60)+'ms" onclick="quickSearch(\''+from+'\',\''+to+'\')">'+
                '<div class="deal-imgwrap" style="height:180px">'+inner+
                    '<div class="deal-mask"></div>'+
                    '<div class="deal-info">'+
                        '<p class="deal-from">'+from+' 出发 · '+info+'</p>'+
                        '<p class="deal-city">'+from+' → '+to+'</p>'+
                    '</div>'+
                '</div>'+
            '</button>';
        }
        document.getElementById('routesDomestic').innerHTML=ROUTES.domestic.map((r,i)=>routeCard(r,i)).join('');
        document.getElementById('routesTravel').innerHTML=ROUTES.travel.map((r,i)=>routeCard(r,i)).join('');
        document.getElementById('routesIntl').innerHTML=ROUTES.intl.map((r,i)=>routeCard(r,i)).join('');
        document.getElementById('routesNiche').innerHTML=ROUTES.niche.map((r,i)=>routeCard(r,i)).join('');
    </script>
</body>
</html>
